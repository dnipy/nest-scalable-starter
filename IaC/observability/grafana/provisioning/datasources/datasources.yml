apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: PBFA97CFB590B2093
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    access: proxy
    uid: P8E80F9AEF21F6940
    url: http://loki:3100
    editable: true
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":"([a-f0-9]+)"'
          matcherType: regex
          datasourceUid: P214B5B846CF3925F
          url: '${__value.raw}'
          urlDisplayLabel: ''

  - name: Tempo
    type: tempo
    access: proxy
    uid: P214B5B846CF3925F
    url: http://tempo:3200
    editable: true
    jsonData:
      tracesToLogsV2:
        customQuery: false
        datasourceUid: P8E80F9AEF21F6940
        filterByTraceID: true
        spanStartTimeShift: '-2s'
        spanEndTimeShift: '2s'
        tags:
          - key: service.name
            value: service_name
          - key: service.namespace
            value: service_namespace
